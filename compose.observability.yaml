name: graphx
services:
  prometheus:
    image: prom/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus/data", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    networks: [graphx]
    read_only: true
    tmpfs: ["/prometheus:rw,nosuid,nodev,noexec,size=256m,uid=65534,gid=65534,mode=0770"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
  grafana:
    image: grafana/grafana:13.2.0@sha256:3fd54ae1214669f8355f065ec9f6445d5279a3d77095ab048ca045685272429b
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAPHX_GRAFANA_ADMIN_PASSWORD:-graphx-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    networks: [graphx]
    read_only: true
    tmpfs: [/tmp, /var/lib/grafana]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      prometheus: { condition: service_healthy }
