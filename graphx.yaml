version: 1
graph:
  id: sample-pipeline
  nodes:
    - id: generator
      kind: source
      ports:
        - { name: samples, direction: output, schema: Sample }
    - id: transform
      kind: transform
      ports:
        - { name: samples, direction: input, schema: Sample }
        - { name: transformed, direction: output, schema: TransformedSample }
    - id: sink
      kind: sink
      ports:
        - { name: transformed, direction: input, schema: TransformedSample }
  edges:
    - id: samples
      from: generator.samples
      to: transform.samples
      transport: tcp
    - id: transformed
      from: transform.transformed
      to: sink.transformed
      transport: tcp
transport:
  tcp:
    samples:
      host: transform
      bind: 0.0.0.0
      port: 7001
      framing: u32be
      connect_timeout_ms: 2000
      send_timeout_ms: 5000
      reconnect: true
      retry: { max_attempts: 60, initial_backoff_ms: 100, max_backoff_ms: 2000 }
    transformed:
      host: sink
      bind: 0.0.0.0
      port: 7002
      framing: u32be
      connect_timeout_ms: 2000
      send_timeout_ms: 5000
      reconnect: true
      retry: { max_attempts: 60, initial_backoff_ms: 100, max_backoff_ms: 2000 }
network:
  networks:
    - id: graphx
      driver: bridge
      subnet: 172.30.0.0/24
      gateway: 172.30.0.1
      external: false
  interfaces:
    generator:
      - { id: data, network: graphx }
    transform:
      - { id: data, network: graphx }
    sink:
      - { id: data, network: graphx }
  edge_paths:
    samples: [generator, graphx, transform]
    transformed: [transform, graphx, sink]
deployment:
  network: graphx
  services:
    generator: { image: graphx-demo:latest, command: graphx-generator }
    transform: { image: graphx-demo:latest, command: graphx-transform }
    sink: { image: graphx-demo:latest, command: graphx-sink }
  telemetry:
    service: telemetry
    port: 8080
observability:
  metrics: { enabled: true, exporters: [console, udp-json] }
  tracing: { enabled: true, exporters: [console, udp-json] }
  telemetry: { host: telemetry, port: 9000, websocket: /ws, heartbeat_interval_ms: 1000, heartbeat_timeout_ms: 5000 }
  capture: { enabled: false, provider: pcapng-extcap-future }
