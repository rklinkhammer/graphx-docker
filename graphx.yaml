version: 1
graph:
  id: sample-pipeline
  nodes:
    - id: generator
      kind: source
      ports:
        - { name: samples, direction: output, schema: Sample }
    - id: transform
      kind: transform
      ports:
        - { name: samples, direction: input, schema: Sample }
        - { name: transformed, direction: output, schema: TransformedSample }
    - id: sink
      kind: sink
      ports:
        - { name: transformed, direction: input, schema: TransformedSample }
  edges:
    - id: samples
      from: generator.samples
      to: transform.samples
      transport: tcp
    - id: transformed
      from: transform.transformed
      to: sink.transformed
      transport: tcp
transport:
  tcp:
    samples:
      host: transform
      bind: 0.0.0.0
      port: 7001
      framing: u32be
      connect_timeout_ms: 2000
      send_timeout_ms: 5000
      reconnect: true
      retry: { max_attempts: 60, initial_backoff_ms: 100, max_backoff_ms: 2000 }
    transformed:
      host: sink
      bind: 0.0.0.0
      port: 7002
      framing: u32be
      connect_timeout_ms: 2000
      send_timeout_ms: 5000
      reconnect: true
      retry: { max_attempts: 60, initial_backoff_ms: 100, max_backoff_ms: 2000 }
network:
  networks:
    - id: graphx
      driver: bridge
      subnet: 172.30.0.0/24
      gateway: 172.30.0.1
      external: false
  interfaces:
    generator:
      - { id: data, network: graphx }
    transform:
      - { id: data, network: graphx }
    sink:
      - { id: data, network: graphx }
  edge_paths:
    samples: [generator, graphx, transform]
    transformed: [transform, graphx, sink]
deployment:
  network: graphx
  services:
    generator: { image: graphx-demo:latest, command: graphx-generator }
    transform: { image: graphx-demo:latest, command: graphx-transform }
    sink: { image: graphx-demo:latest, command: graphx-sink }
  telemetry:
    service: telemetry
    port: 8080
observability:
  metrics: { enabled: true, exporters: [console, udp-json] }
  tracing: { enabled: true, exporters: [console, udp-json] }
  telemetry: { host: telemetry, port: 9000, websocket: /ws, heartbeat_interval_ms: 1000, heartbeat_timeout_ms: 5000 }
  capture:
    enabled: false
    provider: pcapng
    directory: captures
    snaplen: 16777220
    max_file_bytes: 268435456
    max_packets: 1000000
  otlp: { enabled: false, endpoint: http://127.0.0.1:4318, traces_path: /v1/traces, metrics_path: /v1/metrics, export_interval_ms: 5000, timeout_ms: 2000, queue_capacity: 1024, max_queue_bytes: 8388608, max_response_bytes: 65536, retry_max_attempts: 3, retry_initial_backoff_ms: 200, retry_max_backoff_ms: 5000 }
  slos: { window_seconds: 300, minimum_window_seconds: 10, availability_target: 0.99, max_error_ratio: 0.01, max_drop_ratio: 0.01, max_p95_latency_us: 10000 }
  history: { enabled: false, backend: sqlite, database_file: .graphx/history.sqlite, retention_seconds: 604800, max_records: 100000, max_database_bytes: 268435456, queue_capacity: 4096, max_queue_bytes: 8388608, batch_size: 100, flush_interval_ms: 250, query_limit: 200, query_timeout_ms: 2000, max_pending_queries: 16, shutdown_timeout_ms: 2000 }
  control: { command_timeout_ms: 2000, command_retention_seconds: 3600, max_commands: 1024, max_audit_records: 4096, idempotency_ttl_seconds: 3600, max_request_bytes: 4096 }
