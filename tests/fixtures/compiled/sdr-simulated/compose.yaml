{
  "name": "sdr-simulated",
  "networks": {
    "data": {
      "driver": "bridge",
      "internal": true,
      "ipam": {
        "config": [
          {
            "subnet": "172.30.13.0/24"
          }
        ]
      }
    },
    "mg-console": {
      "driver": "bridge"
    },
    "mg-processor": {
      "driver": "bridge",
      "internal": true
    },
    "mg-radio": {
      "driver": "bridge",
      "internal": true
    },
    "mg-sink": {
      "driver": "bridge",
      "internal": true
    }
  },
  "services": {
    "platform": {
      "cap_drop": [
        "ALL"
      ],
      "command": [
        "--config",
        "/run/graphx/platform.json"
      ],
      "entrypoint": [
        "graphx-platform"
      ],
      "environment": {
        "GX_CONSOLE": "/run/graphx/console",
        "GX_CREDENTIALS": "/run/secrets",
        "GX_OWNER": "${GX_OWNER}",
        "GX_STATE": "/var/lib/graphx"
      },
      "image": "graphx-design/platform@sha256:41b3db89b6ec78cab84b29c12a1af5024ba670b44463edc40d887cad8b952ba4",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "2",
          "max-size": "1m"
        }
      },
      "mem_limit": 536870912,
      "networks": {
        "mg-console": {},
        "mg-processor": {
          "aliases": [
            "platform"
          ]
        },
        "mg-radio": {
          "aliases": [
            "platform"
          ]
        },
        "mg-sink": {
          "aliases": [
            "platform"
          ]
        }
      },
      "pids_limit": 64,
      "ports": [
        "127.0.0.1:8080:8080"
      ],
      "read_only": true,
      "restart": "no",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,size=16m"
      ],
      "user": "65532:65532",
      "volumes": [
        "./resolved.json:/run/graphx/resolved.json:ro",
        "./platform.json:/run/graphx/platform.json:ro",
        "./credentials.json:/run/graphx/credentials.json:ro",
        "${GX_STATE}/console:/run/graphx/console:ro",
        "${GX_STATE}/history:/var/lib/graphx/history",
        "${GX_STATE}/handoff:/captures:ro",
        "${GX_CREDENTIALS}/observer:/run/secrets/observer:ro",
        "${GX_CREDENTIALS}/runtime-processor:/run/secrets/runtime-processor:ro",
        "${GX_CREDENTIALS}/runtime-radio:/run/secrets/runtime-radio:ro",
        "${GX_CREDENTIALS}/runtime-sink:/run/secrets/runtime-sink:ro"
      ]
    },
    "processor": {
      "cap_drop": [
        "ALL"
      ],
      "command": [
        "--node",
        "processor",
        "--config",
        "/run/graphx/node.json",
        "--release-file",
        "/run/graphx/barriers/release",
        "--release-token",
        "${GX_OWNER}"
      ],
      "entrypoint": [
        "graphx-sdr-processor"
      ],
      "environment": {
        "GRAPHX_CREDENTIALS": "/run/secrets",
        "GRAPHX_TELEMETRY_SHARED_SECRET_FILE": "/run/secrets/runtime-processor/hmac"
      },
      "image": "graphx-design/sdr@sha256:928533888c6b3ecff6123dd69342931275216f99fce32367d76a000ba4a5dd82",
      "labels": {
        "org.graphx.graph": "sdr-simulated",
        "org.graphx.node": "processor",
        "org.graphx.owner": "${GX_OWNER}"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "2",
          "max-size": "1m"
        }
      },
      "mem_limit": 134217728,
      "networks": {
        "data": {
          "ipv4_address": "172.30.13.20"
        },
        "mg-processor": {}
      },
      "pids_limit": 64,
      "read_only": true,
      "restart": "no",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,size=16m"
      ],
      "user": "65532:65532",
      "volumes": [
        "./nodes/processor.json:/run/graphx/node.json:ro",
        "${GX_STATE}/barriers:/run/graphx/barriers:ro",
        "${GX_CREDENTIALS}/lab-processor:/run/secrets/lab-processor:ro",
        "${GX_CREDENTIALS}/runtime-processor:/run/secrets/runtime-processor:ro",
        "${GX_STATE}/captures/processor:/captures"
      ]
    },
    "radio": {
      "cap_drop": [
        "ALL"
      ],
      "command": [
        "--node",
        "radio",
        "--config",
        "/run/graphx/node.json",
        "--release-file",
        "/run/graphx/barriers/release",
        "--release-token",
        "${GX_OWNER}"
      ],
      "entrypoint": [
        "graphx-sdr-radio"
      ],
      "environment": {
        "GRAPHX_CREDENTIALS": "/run/secrets",
        "GRAPHX_TELEMETRY_SHARED_SECRET_FILE": "/run/secrets/runtime-radio/hmac"
      },
      "image": "graphx-design/sdr@sha256:928533888c6b3ecff6123dd69342931275216f99fce32367d76a000ba4a5dd82",
      "labels": {
        "org.graphx.graph": "sdr-simulated",
        "org.graphx.node": "radio",
        "org.graphx.owner": "${GX_OWNER}"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "2",
          "max-size": "1m"
        }
      },
      "mem_limit": 134217728,
      "networks": {
        "data": {
          "ipv4_address": "172.30.13.10"
        },
        "mg-radio": {}
      },
      "pids_limit": 64,
      "read_only": true,
      "restart": "no",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,size=16m"
      ],
      "user": "65532:65532",
      "volumes": [
        "./nodes/radio.json:/run/graphx/node.json:ro",
        "${GX_STATE}/barriers:/run/graphx/barriers:ro",
        "${GX_CREDENTIALS}/lab-radio:/run/secrets/lab-radio:ro",
        "${GX_CREDENTIALS}/runtime-radio:/run/secrets/runtime-radio:ro",
        "${GX_STATE}/captures/radio:/captures"
      ]
    },
    "sink": {
      "cap_drop": [
        "ALL"
      ],
      "command": [
        "--node",
        "sink",
        "--config",
        "/run/graphx/node.json",
        "--release-file",
        "/run/graphx/barriers/release",
        "--release-token",
        "${GX_OWNER}"
      ],
      "entrypoint": [
        "graphx-sdr-sink"
      ],
      "environment": {
        "GRAPHX_CREDENTIALS": "/run/secrets",
        "GRAPHX_TELEMETRY_SHARED_SECRET_FILE": "/run/secrets/runtime-sink/hmac"
      },
      "image": "graphx-design/sdr@sha256:928533888c6b3ecff6123dd69342931275216f99fce32367d76a000ba4a5dd82",
      "labels": {
        "org.graphx.graph": "sdr-simulated",
        "org.graphx.node": "sink",
        "org.graphx.owner": "${GX_OWNER}"
      },
      "logging": {
        "driver": "json-file",
        "options": {
          "max-file": "2",
          "max-size": "1m"
        }
      },
      "mem_limit": 134217728,
      "networks": {
        "data": {
          "ipv4_address": "172.30.13.30"
        },
        "mg-sink": {}
      },
      "pids_limit": 64,
      "read_only": true,
      "restart": "no",
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:rw,nosuid,nodev,size=16m"
      ],
      "user": "65532:65532",
      "volumes": [
        "./nodes/sink.json:/run/graphx/node.json:ro",
        "${GX_STATE}/barriers:/run/graphx/barriers:ro",
        "${GX_CREDENTIALS}/runtime-sink:/run/secrets/runtime-sink:ro",
        "${GX_STATE}/captures/sink:/captures"
      ]
    }
  }
}
