    pids_limit: 64
    read_only: true
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    tmpfs:
    - /tmp:rw,nosuid,nodev,size=16m
    user: 65532:65532
    volumes:
    - ./nodes/radio-west.json:/run/graphx/node.json:ro
    - ${GX_STATE}/barriers:/run/graphx/barriers:ro
    - ${GX_CREDENTIALS}/radio-west:/run/secrets/radio-west:ro
    - ${GX_CREDENTIALS}/runtime-radio-west:/run/secrets/runtime-radio-west:ro
  sink-east:
