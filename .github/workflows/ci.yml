name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }} / C++20
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Ninja on Linux
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y
          ninja-build libssl-dev python3 tshark
      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja openssl@3
      - name: Configure
        run: >-
          cmake -S . -B build/ci -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGRAPHX_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/ci -j 4
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure -L quick
      - name: Scheduled stress tests
        if: github.event_name == 'schedule'
        run: ctest --test-dir build/ci --output-on-failure -L stress

  sanitizers:
    name: ${{ matrix.os }} / ASan+UBSan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asan_options: detect_leaks=1:strict_string_checks=1
          - os: macos-15
            asan_options: detect_leaks=0:strict_string_checks=1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Ninja on Linux
        if: runner.os == 'Linux'
        run: |
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.gpg.key
          test "$(gpg --show-keys --with-colons /tmp/llvm-snapshot.gpg.key | awk -F: '$1 == "fpr" { print $10; exit }')" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          gpg --dearmor < /tmp/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/apt.llvm.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21 clang-tools-21 llvm-21 libclang-rt-21-dev ninja-build libssl-dev
      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install llvm@21 ninja openssl@3
      - name: Select LLVM 21
        shell: bash
        run: |
          if test "$RUNNER_OS" = macOS; then
            llvm_bin="$(brew --prefix llvm@21)/bin"
            cc="$llvm_bin/clang"
            cxx="$llvm_bin/clang++"
            symbolizer="$llvm_bin/llvm-symbolizer"
            echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
          else
            cc=/usr/bin/clang-21
            cxx=/usr/bin/clang++-21
            symbolizer=/usr/bin/llvm-symbolizer-21
          fi
          echo "CC=$cc" >> "$GITHUB_ENV"
          echo "CXX=$cxx" >> "$GITHUB_ENV"
          echo "ASAN_SYMBOLIZER_PATH=$symbolizer" >> "$GITHUB_ENV"
      - name: Configure and build
        run: |
          cmake --preset sanitizers
          cmake --build --preset sanitizers -j 4
      - name: Test
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --preset sanitizers

  quality:
    name: Format and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned analysis toolchain
        run: |
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.gpg.key
          test "$(gpg --show-keys --with-colons /tmp/llvm-snapshot.gpg.key | awk -F: '$1 == "fpr" { print $10; exit }')" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          gpg --dearmor < /tmp/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/apt.llvm.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21 clang-format-21 clang-tidy-21 cppcheck ninja-build libssl-dev
      - name: Check formatting
        env:
          CLANG_FORMAT: clang-format-21
        run: scripts/check-format.sh
      - name: Run clang-tidy and cppcheck
        env:
          CC: clang-21
          CXX: clang++-21
          CLANG_TIDY: clang-tidy-21
          CPPCHECK: cppcheck
        run: scripts/run-static-analysis.sh
      - name: Run Clang 21 with libstdc++ 15
        run: scripts/test-linux-container.sh quality

  fuzz:
    name: Bounded libFuzzer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Clang and corpus tools
        run: |
          curl --fail --silent --show-error https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-snapshot.gpg.key
          test "$(gpg --show-keys --with-colons /tmp/llvm-snapshot.gpg.key | awk -F: '$1 == "fpr" { print $10; exit }')" = "6084F3CF814B57C1CF12EFD515CF4D18AF4F7421"
          gpg --dearmor < /tmp/llvm-snapshot.gpg.key | sudo tee /usr/share/keyrings/apt.llvm.org.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y clang-21 clang-tools-21 llvm-21 libclang-rt-21-dev libfuzzer-21-dev ninja-build xxd libssl-dev
      - name: Fuzz envelope and frame decoders
        env:
          CC: clang-21
          CXX: clang++-21
          GRAPHX_FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '30' }}
        run: scripts/run-fuzz.sh

  portable:
    name: Portable integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install build tools
        run: >-
          sudo apt-get update &&
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y
          ninja-build libssl-dev python3 tshark
      - name: Run portable acceptance
        run: scripts/test-features.sh portable
      - name: Audit production JavaScript dependencies
        run: |
          npm audit --prefix apps/telemetry --omit=dev
          npm audit --prefix web --omit=dev

  containers:
    name: Compose model and images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Validate Compose model
        run: docker compose -f compose.yaml config --quiet
      - name: Build affected images
        run: docker compose -f compose.yaml build
      - name: Verify capture-volume identity and collector read-only access
        run: bash scripts/test-container-hardening.sh

  release-contract:
    name: No-publish release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install packaging tools
        run: >-
          sudo apt-get update &&
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y
          ninja-build libssl-dev python3 tshark
      - name: Build and verify candidate without publishing
        run: |
          version="$(tr -d '\n' < VERSION)"
          python3 scripts/release/validate_version.py --tag "v${version}"
          python3 scripts/release/build_release.py \
            --build-dir build/release-contract \
            --output-dir outputs/release-contract \
            --tag "v${version}"
          python3 scripts/release/verify_release.py outputs/release-contract --source .
          python3 scripts/release/build_release.py \
            --build-dir build/release-reproducibility \
            --output-dir outputs/release-reproducibility \
            --tag "v${version}"
          for candidate in outputs/release-contract/*; do
            cmp "$candidate" "outputs/release-reproducibility/$(basename "$candidate")"
          done
