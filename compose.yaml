name: graphx
services:
  sink:
    build: .
    image: graphx-demo:latest
    entrypoint: ["/usr/local/bin/graphx-sink"]
    environment:
      GRAPHX_INPUT_PORT: "7002"
      GRAPHX_TELEMETRY_HOST: telemetry
      GRAPHX_TELEMETRY_PORT: "9000"
    depends_on: [telemetry]
    networks: [graphx]
  transform:
    build: .
    image: graphx-demo:latest
    entrypoint: ["/usr/local/bin/graphx-transform"]
    environment:
      GRAPHX_INPUT_PORT: "7001"
      GRAPHX_OUTPUT_HOST: sink
      GRAPHX_OUTPUT_PORT: "7002"
      GRAPHX_TELEMETRY_HOST: telemetry
      GRAPHX_TELEMETRY_PORT: "9000"
    depends_on: [sink, telemetry]
    networks: [graphx]
  generator:
    build: .
    image: graphx-demo:latest
    entrypoint: ["/usr/local/bin/graphx-generator"]
    environment:
      GRAPHX_OUTPUT_HOST: transform
      GRAPHX_OUTPUT_PORT: "7001"
      GRAPHX_INTERVAL_MS: "500"
      GRAPHX_TELEMETRY_HOST: telemetry
      GRAPHX_TELEMETRY_PORT: "9000"
    depends_on: [transform, telemetry]
    networks: [graphx]
  telemetry:
    build:
      context: .
      dockerfile: docker/telemetry.Dockerfile
    image: graphx-telemetry:latest
    ports: ["8080:8080"]
    expose: ["9000/udp"]
    networks: [graphx]

networks:
  graphx:
    driver: bridge
