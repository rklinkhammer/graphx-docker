name: graphx
services:
  sink:
    build: .
    image: graphx-demo:latest
    entrypoint: ["/usr/local/bin/graphx-sink"]
    environment:
      GRAPHX_TELEMETRY_HOST: telemetry
      GRAPHX_TELEMETRY_PORT: "9000"
      GRAPHX_CAPTURE_ENABLED: ${GRAPHX_CAPTURE_ENABLED:-false}
      GRAPHX_CAPTURE_PROVIDER: pcapng
      GRAPHX_CAPTURE_DIR: /captures
      GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}
    depends_on: [telemetry]
    volumes: [captures:/captures]
    networks: [graphx]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    init: true
  transform:
    build: .
    image: graphx-demo:latest
    entrypoint: ["/usr/local/bin/graphx-transform"]
    environment:
      GRAPHX_TELEMETRY_HOST: telemetry
      GRAPHX_TELEMETRY_PORT: "9000"
      GRAPHX_CAPTURE_ENABLED: ${GRAPHX_CAPTURE_ENABLED:-false}
      GRAPHX_CAPTURE_PROVIDER: pcapng
      GRAPHX_CAPTURE_DIR: /captures
      GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}
    depends_on: [sink, telemetry]
    volumes: [captures:/captures]
    networks: [graphx]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    init: true
  generator:
    build: .
    image: graphx-demo:latest
    entrypoint: ["/usr/local/bin/graphx-generator"]
    environment:
      GRAPHX_INTERVAL_MS: "500"
      GRAPHX_TELEMETRY_HOST: telemetry
      GRAPHX_TELEMETRY_PORT: "9000"
      GRAPHX_CAPTURE_ENABLED: ${GRAPHX_CAPTURE_ENABLED:-false}
      GRAPHX_CAPTURE_PROVIDER: pcapng
      GRAPHX_CAPTURE_DIR: /captures
      GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}
    depends_on: [transform, telemetry]
    volumes: [captures:/captures]
    networks: [graphx]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    init: true
  telemetry:
    build:
      context: .
      dockerfile: docker/telemetry.Dockerfile
    image: graphx-telemetry:latest
    ports: ["127.0.0.1:8080:8080"]
    expose: ["9000/udp"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    environment:
      GRAPHX_CAPTURE_ENABLED: ${GRAPHX_CAPTURE_ENABLED:-false}
      GRAPHX_CAPTURE_PROVIDER: pcapng
      GRAPHX_CAPTURE_DIR: /captures
      GRAPHX_CONTROL_TOKEN: ${GRAPHX_CONTROL_TOKEN:-}
      GRAPHX_OBSERVATION_TOKEN: ${GRAPHX_OBSERVATION_TOKEN:-}
      GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}
      GRAPHX_HTTP_BIND: 0.0.0.0
      GRAPHX_TELEMETRY_BIND: 0.0.0.0
      GRAPHX_ALLOW_INSECURE_REMOTE: "true"
      GRAPHX_ALLOWED_ORIGINS: ${GRAPHX_ALLOWED_ORIGINS:-http://127.0.0.1:8080}
      GRAPHX_OTLP_ENDPOINT: ${GRAPHX_OTLP_ENDPOINT:-}
      GRAPHX_OTLP_AUTH_TOKEN: ${GRAPHX_OTLP_AUTH_TOKEN:-}
      GRAPHX_OTLP_CA_FILE: ${GRAPHX_OTLP_CA_FILE:-}
      GRAPHX_OTLP_EXPORT_INTERVAL_MS: ${GRAPHX_OTLP_EXPORT_INTERVAL_MS:-}
      GRAPHX_OTLP_TIMEOUT_MS: ${GRAPHX_OTLP_TIMEOUT_MS:-}
      GRAPHX_OTLP_QUEUE_CAPACITY: ${GRAPHX_OTLP_QUEUE_CAPACITY:-}
      GRAPHX_OTLP_MAX_QUEUE_BYTES: ${GRAPHX_OTLP_MAX_QUEUE_BYTES:-}
      GRAPHX_OTLP_MAX_RESPONSE_BYTES: ${GRAPHX_OTLP_MAX_RESPONSE_BYTES:-}
      GRAPHX_OTLP_RETRY_MAX_ATTEMPTS: ${GRAPHX_OTLP_RETRY_MAX_ATTEMPTS:-}
      GRAPHX_OTLP_RETRY_INITIAL_BACKOFF_MS: ${GRAPHX_OTLP_RETRY_INITIAL_BACKOFF_MS:-}
      GRAPHX_OTLP_RETRY_MAX_BACKOFF_MS: ${GRAPHX_OTLP_RETRY_MAX_BACKOFF_MS:-}
      GRAPHX_HISTORY_ENABLED: ${GRAPHX_HISTORY_ENABLED:-}
      GRAPHX_HISTORY_BACKEND: ${GRAPHX_HISTORY_BACKEND:-}
      GRAPHX_HISTORY_DATABASE_FILE: ${GRAPHX_HISTORY_DATABASE_FILE:-}
      GRAPHX_HISTORY_RETENTION_SECONDS: ${GRAPHX_HISTORY_RETENTION_SECONDS:-}
      GRAPHX_HISTORY_MAX_RECORDS: ${GRAPHX_HISTORY_MAX_RECORDS:-}
      GRAPHX_HISTORY_MAX_DATABASE_BYTES: ${GRAPHX_HISTORY_MAX_DATABASE_BYTES:-}
      GRAPHX_HISTORY_QUEUE_CAPACITY: ${GRAPHX_HISTORY_QUEUE_CAPACITY:-}
      GRAPHX_HISTORY_MAX_QUEUE_BYTES: ${GRAPHX_HISTORY_MAX_QUEUE_BYTES:-}
      GRAPHX_HISTORY_BATCH_SIZE: ${GRAPHX_HISTORY_BATCH_SIZE:-}
      GRAPHX_HISTORY_FLUSH_INTERVAL_MS: ${GRAPHX_HISTORY_FLUSH_INTERVAL_MS:-}
      GRAPHX_HISTORY_QUERY_LIMIT: ${GRAPHX_HISTORY_QUERY_LIMIT:-}
      GRAPHX_HISTORY_QUERY_TIMEOUT_MS: ${GRAPHX_HISTORY_QUERY_TIMEOUT_MS:-}
      GRAPHX_HISTORY_MAX_PENDING_QUERIES: ${GRAPHX_HISTORY_MAX_PENDING_QUERIES:-}
      GRAPHX_HISTORY_SHUTDOWN_TIMEOUT_MS: ${GRAPHX_HISTORY_SHUTDOWN_TIMEOUT_MS:-}
    volumes: [captures:/captures:ro]
    networks: [graphx]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    init: true

networks:
  graphx:
    driver: bridge

volumes:
  captures:
