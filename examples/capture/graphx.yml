# GraphX version 3. Compile and run with a verified portable/native release.
catalog: ../../config/catalog/lock.json
connections:
  samples:
    from: generator.samples
    to: transform.samples
    transport: tcp
  transformed:
    from: transform.transformed
    to: sink.transformed
    transport: tcp
graph:
  id: application-capture
nodes:
  generator:
    execution:
      kind: native
    parameters:
      interval_ms: 20
      max_messages: 10
    type: sample.source
  sink:
    execution:
      kind: native
    parameters:
      max_messages: 10
    type: sample.sink
  transform:
    execution:
      kind: native
    parameters:
      max_messages: 10
    type: sample.transform
platform:
  capture:
    enabled: true
version: 3
