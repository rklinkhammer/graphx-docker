# GraphX version 3. Validation and compilation available; execution adapters are unavailable.
catalog: ../../../config/catalog/lock.json
connections:
  samples:
    from: generator.samples
    to: transform.samples
    transport: tcp
  transformed:
    from: transform.transformed
    to: sink.transformed
    transport: tcp
credentials:
  operator:
    identity: operator
    members:
    - token
    provider: external
graph:
  id: variant-control
nodes:
  generator:
    execution:
      kind: container
    type: sample.source
  sink:
    execution:
      kind: container
    type: sample.sink
  transform:
    execution:
      kind: container
    type: sample.transform
platform:
  control:
    enabled: true
    grants:
    - actions:
      - pause
      - resume
      credential: operator
      nodes:
      - generator
version: 3
