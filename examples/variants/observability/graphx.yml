# GraphX version 3 authored source. Compile before execution.
catalog: ../../../config/catalog/lock.json
connections:
  samples:
    from: generator.samples
    to: transform.samples
    transport: tcp
  transformed:
    from: transform.transformed
    to: sink.transformed
    transport: tcp
credentials:
  grafana-admin:
    identity: grafana
    members:
    - password
    provider: external
graph:
  id: variant-observability
nodes:
  generator:
    execution:
      kind: container
    type: sample.source
  sink:
    execution:
      kind: container
    type: sample.sink
  transform:
    execution:
      kind: container
    type: sample.transform
platform:
  extensions:
  - prometheus
  - grafana
version: 3
