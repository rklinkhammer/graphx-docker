services:
  generator:
    build: ../../..
    image: graphx-demo:latest
    entrypoint: ["/usr/local/bin/graphx-generator"]
    volumes: ["../graphx.yaml:/etc/graphx/graphx.yaml:ro"]
    networks:
      data:
        ipv4_address: 10.30.0.10
        mac_address: "02:30:00:00:00:10"
networks:
  data: { name: gx-macvlan-demo, external: true }
