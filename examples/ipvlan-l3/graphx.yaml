# Canonical M8 OVS realization.
version: 2
graph:
  id: ipvlan-l3-pipeline
  nodes:
    - id: generator
      kind: source
      ports: [{name: samples, direction: output, schema: Sample}]
    - id: transform
      kind: transform
      ports:
        - {name: samples, direction: input, schema: Sample}
        - {name: transformed, direction: output, schema: TransformedSample}
    - id: sink
      kind: sink
      ports: [{name: transformed, direction: input, schema: TransformedSample}]
  edges:
    - {id: samples, from: generator.samples, to: transform.samples, transport: tcp}
    - {id: transformed, from: transform.transformed, to: sink.transformed, transport: tcp}
transport:
  tcp:
    samples:
      host: 10.42.2.20
      bind: 0.0.0.0
      port: 7001
      connect_timeout_ms: 1000
      send_timeout_ms: 5000
      reconnect: true
      retry: {max_attempts: 60, initial_backoff_ms: 100, max_backoff_ms: 2000}
    transformed:
      host: 10.42.3.30
      bind: 0.0.0.0
      port: 7002
      connect_timeout_ms: 1000
      send_timeout_ms: 5000
      reconnect: true
      retry: {max_attempts: 60, initial_backoff_ms: 100, max_backoff_ms: 2000}
network:
  networks:
    - id: gx-ipvl3-domains
      subnets:
        - 10.42.1.0/24
        - 10.42.2.0/24
        - 10.42.3.0/24
      external: true
      profile: ipvlan-l3
      uplink: gx-l3-parent
  edge_paths:
    samples: [generator, gx-ipvl3-domains, transform]
    transformed: [transform, gx-ipvl3-domains, sink]
  switches:
    - id: gxbc96833c8a7d9
      kind: openvswitch
      datapath: system
      ports:
        []
  attachments:
    - id: generator-data
      kind: container_veth
      owner: generator
      network: gx-ipvl3-domains
      address: 10.42.1.10/24
      mac: 02:42:00:00:00:01
      interface: gxc5103c0988d67
      peer: gxh5103c0988d67
      switch: gxbc96833c8a7d9
      routes:
        - {destination: 10.42.2.0/24}
        - {destination: 10.42.3.0/24}
    - id: transform-data
      kind: container_veth
      owner: transform
      network: gx-ipvl3-domains
      address: 10.42.2.20/24
      mac: 02:42:00:00:00:01
      interface: gxcf68db3f19a50
      peer: gxhf68db3f19a50
      switch: gxbc96833c8a7d9
      routes:
        - {destination: 10.42.1.0/24}
        - {destination: 10.42.3.0/24}
    - id: sink-data
      kind: container_veth
      owner: sink
      network: gx-ipvl3-domains
      address: 10.42.3.30/24
      mac: 02:42:00:00:00:01
      interface: gxc498d40724d3b
      peer: gxh498d40724d3b
      switch: gxbc96833c8a7d9
      routes:
        - {destination: 10.42.1.0/24}
        - {destination: 10.42.2.0/24}
deployment:
  services:
    generator: {image: graphx-demo:latest, command: graphx-generator}
    transform: {image: graphx-demo:latest, command: graphx-transform}
    sink: {image: graphx-demo:latest, command: graphx-sink}
  project: ipvlan-l3-pipeline
