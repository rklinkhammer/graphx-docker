# Management-only Compose services; GraphX owns the OVS data plane.
name: sdr-external-linux-demo

x-logging: &bounded-logging
  driver: json-file
  options: {max-size: "1m", max-file: "2"}

x-sdr-service: &sdr-service
  image: graphx-sdr-services:latest
  user: "${GRAPHX_HOST_UID:?set by demo.sh}:${GRAPHX_HOST_GID:?set by demo.sh}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  init: true
  logging: *bounded-logging

services:
  processor:
    <<: *sdr-service
    build:
      context: ../../..
      dockerfile: examples/sdr-node/Dockerfile.services
    command: ["python3", "common/processor.py"]
    environment:
      SDR_CONTROL_TARGET: 10.63.0.10
      SDR_SAMPLE_SOURCE: 10.63.0.10
      SDR_RESULT_TARGET: 10.63.0.30
      SDR_TLS_CERT: /run/sdr-tls/processor.pem
      SDR_TLS_KEY: /run/sdr-tls/processor.key
      SDR_TLS_CA: /run/sdr-tls/ca.pem
      SDR_TLS_SERVER_NAME: sdr-node
    volumes: ["${GRAPHX_SDR_TLS_DIR:?set by demo.sh}:/run/sdr-tls:ro"]
    depends_on: [sink]
  sink:
    <<: *sdr-service
    command: ["python3", "common/sink.py"]
