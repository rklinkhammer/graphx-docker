name: graphx-sdr-simulated
x-logging: &bounded-logging
  driver: json-file
  options: { max-size: "1m", max-file: "2" }
x-sdr-service: &sdr-service
  image: graphx-sdr-services:latest
  user: "${GRAPHX_HOST_UID:-65532}:${GRAPHX_HOST_GID:-65532}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  init: true
  logging: *bounded-logging
x-sdr-environment: &sdr-environment
  GRAPHX_NORMALIZED_CONFIG: /run/graphx/normalized.json
  GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}
services:
  normalize-config:
    build:
      context: ../../..
      secrets: [graphx_ca, graphx_cert_installer]
      args: { GRAPHX_BUILD_TRUST_FINGERPRINT: "${GRAPHX_BUILD_TRUST_FINGERPRINT:-graphx-trust-v1-none}" }
    image: graphx-demo:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        umask 022;
        /usr/local/bin/graphx config normalize /config/graphx.yaml > /run/graphx/normalized.json.tmp;
        chmod 0444 /run/graphx/normalized.json.tmp;
        mv /run/graphx/normalized.json.tmp /run/graphx/normalized.json
    volumes: [./graphx.yaml:/config/graphx.yaml:ro, normalized-config:/run/graphx]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    restart: "no"
  sdr-node:
    <<: *sdr-service
    command: ["python3", "common/sdr_simulator.py"]
    environment:
      <<: *sdr-environment
      SDR_SAMPLE_TARGET: 172.30.13.20
      SDR_TLS_CERT: /run/sdr-tls/sdr-node.pem
      SDR_TLS_KEY: /run/sdr-tls/sdr-node.key
      SDR_TLS_CLIENT_CA: /run/sdr-tls/ca.pem
    volumes:
      - "${GRAPHX_SDR_TLS_DIR:?set by demo.sh}:/run/sdr-tls:ro"
      - normalized-config:/run/graphx:ro
    depends_on: [telemetry]
    networks:
      sdr-ethernet: { ipv4_address: 172.30.13.10 }
  processor:
    <<: *sdr-service
    build:
      context: ../../..
      dockerfile: examples/sdr-node/Dockerfile.services
    command: ["python3", "common/processor.py"]
    environment:
      <<: *sdr-environment
      SDR_SAMPLE_BIND: 0.0.0.0
      SDR_SAMPLE_SOURCE: 172.30.13.10
      SDR_CONTROL_TARGET: sdr-node
      SDR_RESULT_TARGET: sink
      SDR_TLS_CERT: /run/sdr-tls/processor.pem
      SDR_TLS_KEY: /run/sdr-tls/processor.key
      SDR_TLS_CA: /run/sdr-tls/ca.pem
      SDR_TLS_SERVER_NAME: sdr-node
    volumes:
      - "${GRAPHX_SDR_TLS_DIR:?set by demo.sh}:/run/sdr-tls:ro"
      - normalized-config:/run/graphx:ro
    depends_on: [sdr-node, sink, telemetry]
    networks:
      sdr-ethernet: { ipv4_address: 172.30.13.20 }
  sink:
    <<: *sdr-service
    command: ["python3", "common/sink.py"]
    environment: *sdr-environment
    volumes: [normalized-config:/run/graphx:ro]
    depends_on: [telemetry]
    networks:
      sdr-ethernet: { ipv4_address: 172.30.13.30 }
  packet-capture:
    <<: *sdr-service
    command: ["tcpdump", "-U", "-n", "-i", "eth0", "-s", "65535", "-C", "64", "-W", "1", "-w", "/captures/sdr-node.pcap", "udp port 18400 or tcp port 18401 or tcp port 18402"]
    network_mode: service:processor
    cap_add: [NET_RAW, NET_ADMIN, DAC_OVERRIDE]
    user: "0:0"
    volumes: ["${GRAPHX_SDR_RUN_DIR:?set by demo.sh}:/captures"]
    depends_on: [processor]
  packet-observer:
    <<: *sdr-service
    command: ["python3", "observer/packet_observer.py", "--capture", "/captures/sdr-node.pcap", "--pcapng", "/captures/sdr-node.pcapng", "--database", "/captures/packet-history.sqlite", "--http-bind", "0.0.0.0"]
    environment:
      <<: *sdr-environment
      GRAPHX_PACKET_CAPTURE_SESSION: ${GRAPHX_SDR_RUN_ID:?set by demo.sh}
      GRAPHX_PACKET_OBSERVATION_SOURCE: ethernet-pcap
      GRAPHX_PACKET_RULES: '${GRAPHX_SDR_PACKET_RULES:?set by demo.sh}'
      GRAPHX_NORMALIZED_CONFIG: /run/graphx/normalized.json
      GRAPHX_CAPTURE_ENABLED: ${GRAPHX_CAPTURE_ENABLED:-true}
      GRAPHX_PACKET_HISTORY_ENABLED: ${GRAPHX_HISTORY_ENABLED:-true}
    volumes:
      - "${GRAPHX_SDR_RUN_DIR:?set by demo.sh}:/captures"
      - normalized-config:/run/graphx:ro
    depends_on: [packet-capture, telemetry]
    networks: [sdr-ethernet]
  telemetry:
    build:
      context: ../../..
      dockerfile: docker/telemetry.Dockerfile
      secrets: [graphx_ca, graphx_cert_installer]
      args: { GRAPHX_BUILD_TRUST_FINGERPRINT: "${GRAPHX_BUILD_TRUST_FINGERPRINT:-graphx-trust-v1-none}" }
    image: graphx-telemetry:latest
    ports: ["127.0.0.1:${GRAPHX_SDR_GUI_PORT:-8080}:8080"]
    environment:
      GRAPHX_NORMALIZED_CONFIG: /run/graphx/normalized.json
      GRAPHX_CONFIG_DIRECTORY: /app
      GRAPHX_HTTP_BIND: 0.0.0.0
      GRAPHX_TELEMETRY_BIND: 0.0.0.0
      GRAPHX_ALLOW_INSECURE_REMOTE: "true"
      GRAPHX_ALLOWED_ORIGINS: "http://127.0.0.1:${GRAPHX_SDR_GUI_PORT:-8080},http://localhost:${GRAPHX_SDR_GUI_PORT:-8080}"
      GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}
      GRAPHX_CONTROL_TOKEN: ${GRAPHX_CONTROL_TOKEN:-}
      GRAPHX_CAPTURE_ENABLED: ${GRAPHX_CAPTURE_ENABLED:-true}
      GRAPHX_CAPTURE_DIR: /captures
      GRAPHX_PACKET_HISTORY_URL: http://packet-observer:9100
      GRAPHX_HISTORY_ENABLED: ${GRAPHX_HISTORY_ENABLED:-true}
      GRAPHX_HISTORY_DATABASE_FILE: /var/lib/graphx/history/history.sqlite
    volumes:
      - "${GRAPHX_SDR_RUN_DIR:?set by demo.sh}:/captures:ro"
      - normalized-config:/run/graphx:ro
      - sdr-history:/var/lib/graphx/history
    depends_on:
      normalize-config: { condition: service_completed_successfully }
    networks:
      sdr-ethernet: { ipv4_address: 172.30.13.40 }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    init: true
    logging: *bounded-logging
networks:
  sdr-ethernet:
    driver: bridge
    ipam:
      config: [{ subnet: 172.30.13.0/24, gateway: 172.30.13.1 }]
volumes:
  sdr-history:
  normalized-config:
secrets:
  graphx_ca:
    file: ${GRAPHX_CA_CERT:-/dev/null}
  graphx_cert_installer:
    file: ${GRAPHX_CERT_INSTALL_SCRIPT:-/dev/null}
