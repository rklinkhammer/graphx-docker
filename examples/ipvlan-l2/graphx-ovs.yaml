# GraphX deterministic migration from configuration version 1.
# Review semantic profiles and attachment kinds before realization.
version: 2
graph:
  id: ipvlan-l2-pipeline
  nodes:
    - id: generator
      kind: source
      ports: [{name: samples, direction: output, schema: Sample}]
    - id: transform
      kind: transform
      ports:
        - {name: samples, direction: input, schema: Sample}
        - {name: transformed, direction: output, schema: TransformedSample}
    - id: sink
      kind: sink
      ports: [{name: transformed, direction: input, schema: TransformedSample}]
  edges:
    - {id: samples, from: generator.samples, to: transform.samples, transport: tcp}
    - {id: transformed, from: transform.transformed, to: sink.transformed, transport: tcp}
transport:
  tcp:
    samples:
      host: 10.41.2.20
      bind: 0.0.0.0
      port: 7001
      connect_timeout_ms: 1000
      send_timeout_ms: 5000
      reconnect: true
      retry: {max_attempts: 60, initial_backoff_ms: 100, max_backoff_ms: 2000}
    transformed:
      host: 10.41.3.30
      bind: 0.0.0.0
      port: 7002
      connect_timeout_ms: 1000
      send_timeout_ms: 5000
      reconnect: true
      retry: {max_attempts: 60, initial_backoff_ms: 100, max_backoff_ms: 2000}
network:
  networks:
    - {id: gx-ipvl2-generator, gateway: 10.41.1.1, external: true, profile: ipvlan-l2, subnets: [10.41.1.0/24], uplink: l2g-parent}
    - {id: gx-ipvl2-transform, gateway: 10.41.2.1, external: true, profile: ipvlan-l2, subnets: [10.41.2.0/24], uplink: l2t-parent}
    - {id: gx-ipvl2-sink, gateway: 10.41.3.1, external: true, profile: ipvlan-l2, subnets: [10.41.3.0/24], uplink: l2s-parent}
  switches:
    - id: br-l2-gen
      kind: openvswitch
      datapath: system
      ports:
        - {id: docker-parent, interface: l2g-ovs, peer: l2g-parent}
        - {id: capture, interface: l2g-cap-ovs, peer: l2g-cap}
      mirror: {id: mirror-l2-gen, output_port: capture, select_all: true}
    - id: br-l2-xform
      kind: openvswitch
      datapath: system
      ports:
        - {id: docker-parent, interface: l2t-ovs, peer: l2t-parent}
        - {id: capture, interface: l2t-cap-ovs, peer: l2t-cap}
      mirror: {id: mirror-l2-xform, output_port: capture, select_all: true}
    - id: br-l2-sink
      kind: openvswitch
      datapath: system
      ports:
        - {id: docker-parent, interface: l2s-ovs, peer: l2s-parent}
        - {id: capture, interface: l2s-cap-ovs, peer: l2s-cap}
      mirror: {id: mirror-l2-sink, output_port: capture, select_all: true}
  routers:
    - id: ipvlan-l2-router
      kind: linux_namespace
      namespace: gx-ipvl2-rtr
      forwarding: true
      interfaces:
        - {id: generator, network: gx-ipvl2-generator, address: 10.41.1.1/24, device: rt-l2g, peer: l2g-router, switch: br-l2-gen}
        - {id: transform, network: gx-ipvl2-transform, address: 10.41.2.1/24, device: rt-l2t, peer: l2t-router, switch: br-l2-xform}
        - {id: sink, network: gx-ipvl2-sink, address: 10.41.3.1/24, device: rt-l2s, peer: l2s-router, switch: br-l2-sink}
      policies:
        - {id: generator-to-transform, source: 10.41.1.0/24, destination: 10.41.2.0/24, action: accept}
        - {id: transform-to-sink, source: 10.41.2.0/24, destination: 10.41.3.0/24, action: accept}
  edge_paths:
    samples: [generator, gx-ipvl2-generator, br-l2-gen, ipvlan-l2-router, br-l2-xform, gx-ipvl2-transform, transform]
    transformed: [transform, gx-ipvl2-transform, br-l2-xform, ipvlan-l2-router, br-l2-sink, gx-ipvl2-sink, sink]
  attachments:
    - id: generator-data
      kind: container_veth
      owner: generator
      network: gx-ipvl2-generator
      address: 10.41.1.10/24
      mac: 02:41:00:00:00:01
      interface: gxc5103c0988d67
      peer: gxh5103c0988d67
      switch: br-l2-gen
      routes: [{destination: 10.41.2.0/24, via: 10.41.1.1}]
    - id: transform-data
      kind: container_veth
      owner: transform
      network: gx-ipvl2-transform
      address: 10.41.2.20/24
      mac: 02:41:00:00:00:01
      interface: gxcf68db3f19a50
      peer: gxhf68db3f19a50
      switch: br-l2-xform
      routes:
        - {destination: 10.41.1.0/24, via: 10.41.2.1}
        - {destination: 10.41.3.0/24, via: 10.41.2.1}
    - id: sink-data
      kind: container_veth
      owner: sink
      network: gx-ipvl2-sink
      address: 10.41.3.30/24
      mac: 02:41:00:00:00:01
      interface: gxc498d40724d3b
      peer: gxh498d40724d3b
      switch: br-l2-sink
      routes: [{destination: 10.41.2.0/24, via: 10.41.3.1}]
    - id: ipvlan-l2-router-generator
      kind: namespace_veth
      owner: ipvlan-l2-router
      network: gx-ipvl2-generator
      address: 10.41.1.1/24
      mac: 02:41:00:00:00:01
      interface: rt-l2g
      peer: l2g-router
      switch: br-l2-gen
    - id: ipvlan-l2-router-transform
      kind: namespace_veth
      owner: ipvlan-l2-router
      network: gx-ipvl2-transform
      address: 10.41.2.1/24
      mac: 02:41:00:00:00:01
      interface: rt-l2t
      peer: l2t-router
      switch: br-l2-xform
    - id: ipvlan-l2-router-sink
      kind: namespace_veth
      owner: ipvlan-l2-router
      network: gx-ipvl2-sink
      address: 10.41.3.1/24
      mac: 02:41:00:00:00:01
      interface: rt-l2s
      peer: l2s-router
      switch: br-l2-sink
    - id: mirror-l2-gen
      kind: mirror
      owner: br-l2-gen
      interface: l2g-cap-ovs
      switch: br-l2-gen
    - id: mirror-l2-xform
      kind: mirror
      owner: br-l2-xform
      interface: l2t-cap-ovs
      switch: br-l2-xform
    - id: mirror-l2-sink
      kind: mirror
      owner: br-l2-sink
      interface: l2s-cap-ovs
      switch: br-l2-sink
deployment:
  services:
    generator: {image: graphx-demo:latest, command: graphx-generator}
    transform: {image: graphx-demo:latest, command: graphx-transform}
    sink: {image: graphx-demo:latest, command: graphx-sink}
  project: ipvlan-l2-pipeline
observability:
  capture: {enabled: true, provider: ovs-span}
