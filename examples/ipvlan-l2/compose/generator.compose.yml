services:
  generator:
    build:
      context: ../../..
      secrets: [graphx_ca, graphx_cert_installer]
      args: { GRAPHX_BUILD_TRUST_FINGERPRINT: "${GRAPHX_BUILD_TRUST_FINGERPRINT:-graphx-trust-v1-none}" }
    image: graphx-demo:latest
    entrypoint: ["/usr/local/bin/graphx-generator"]
    volumes: ["../graphx.yaml:/etc/graphx/graphx.yaml:ro"]
    networks:
      data: { ipv4_address: 10.41.1.10 }
networks:
  data: { name: gx-ipvl2-generator, external: true }
secrets:
  graphx_ca: { file: "${GRAPHX_CA_CERT:-/dev/null}" }
  graphx_cert_installer: { file: "${GRAPHX_CERT_INSTALL_SCRIPT:-/dev/null}" }
