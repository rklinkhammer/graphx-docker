version: 2
graph:
  id: network-observability
  nodes:
    - id: packet-source
      kind: virtual-machine
      runtime: qemu
      execution: host
      lifecycle: external
      control: none
      accelerator: tcg
      architecture: x86_64
      ports: []
  edges: []
transport: {}
network:
  networks:
    - {id: observed-lan, profile: ethernet, subnets: [10.77.0.0/24], gateway: 10.77.0.1, external: false}
  switches:
    - id: br-gx-observe
      kind: openvswitch
      datapath: system
      ports:
        - {id: source, interface: gxobstap0}
        - {id: capture, interface: gxobscap0, peer: gxobscap1}
      mirror: {id: observed-span, output_port: capture, select_all: true}
  attachments:
    - id: source-data
      kind: qemu_tap
      owner: packet-source
      network: observed-lan
      address: 10.77.0.2/24
      interface: gxobstap0
      switch: br-gx-observe
      tap_uid: 65532
      tap_gid: 65532
    - id: observed-span
      kind: mirror
      owner: br-gx-observe
      interface: gxobscap0
      switch: br-gx-observe
  captures:
    - id: ethernet-span
      attachment: observed-span
      directory: /var/lib/graphx/captures/network-observation
      snaplen: 65535
      max_file_bytes: 1048576
      max_files: 4
      rotation_seconds: 60
      retention_seconds: 3600
  faults:
    - id: source-delay
      attachment: source-data
      delay_ms: 20
      jitter_ms: 3
      loss_percent: 1
      duration_seconds: 30

