services:
  transform:
    build:
      context: ../../..
      secrets: [graphx_ca, graphx_cert_installer]
      args: { GRAPHX_BUILD_TRUST_FINGERPRINT: "${GRAPHX_BUILD_TRUST_FINGERPRINT:-graphx-trust-v1-none}" }
    image: graphx-demo:latest
    user: root
    entrypoint: ["sh", "-c"]
    command: ["ip route replace 10.10.0.0/24 via 10.20.0.1 && exec /usr/local/bin/graphx-transform"]
    volumes: ["../graphx.yaml:/etc/graphx/graphx.yaml:ro"]
    cap_add: [NET_ADMIN]
    networks:
      ipv-sim: { ipv4_address: 10.20.0.20 }
  sink:
    build:
      context: ../../..
      secrets: [graphx_ca, graphx_cert_installer]
      args: { GRAPHX_BUILD_TRUST_FINGERPRINT: "${GRAPHX_BUILD_TRUST_FINGERPRINT:-graphx-trust-v1-none}" }
    image: graphx-demo:latest
    user: root
    entrypoint: ["sh", "-c"]
    command: ["ip route replace 10.10.0.0/24 via 10.20.0.1 && exec /usr/local/bin/graphx-sink"]
    volumes: ["../graphx.yaml:/etc/graphx/graphx.yaml:ro"]
    cap_add: [NET_ADMIN]
    networks:
      ipv-sim: { ipv4_address: 10.20.0.30 }
networks:
  ipv-sim: { name: gx-ipv-sim, external: true }
secrets:
  graphx_ca: { file: "${GRAPHX_CA_CERT:-/dev/null}" }
  graphx_cert_installer: { file: "${GRAPHX_CERT_INSTALL_SCRIPT:-/dev/null}" }
