# Canonical OVS realization.
version: 2
graph:
  id: mixed-network
  nodes:
    - id: generator
      kind: source
      ports: [{name: samples, direction: output, schema: Sample}]
    - id: transform
      kind: transform
      ports:
        - {name: samples, direction: input, schema: Sample}
        - {name: transformed, direction: output, schema: TransformedSample}
    - id: sink
      kind: sink
      ports: [{name: transformed, direction: input, schema: TransformedSample}]
  edges:
    - {id: samples, from: generator.samples, to: transform.samples, transport: tcp}
    - {id: transformed, from: transform.transformed, to: sink.transformed, transport: tcp}
transport:
  tcp:
    samples:
      host: 10.20.0.20
      bind: 0.0.0.0
      port: 7001
      framing: u32be
      connect_timeout_ms: 2000
      send_timeout_ms: 5000
      reconnect: true
      retry: {max_attempts: 60, initial_backoff_ms: 100, max_backoff_ms: 2000}
    transformed:
      host: 10.20.0.30
      bind: 0.0.0.0
      port: 7002
      framing: u32be
      connect_timeout_ms: 2000
      send_timeout_ms: 5000
      reconnect: true
      retry: {max_attempts: 60, initial_backoff_ms: 100, max_backoff_ms: 2000}
network:
  networks:
    - {id: gx-mac-domain, gateway: 10.10.0.1, external: true, profile: macvlan, subnets: [10.10.0.0/24], uplink: mv-parent}
    - {id: gx-ipv-domain, gateway: 10.20.0.1, external: true, profile: ipvlan-l2, subnets: [10.20.0.0/24], uplink: iv-parent}
  switches:
    - id: br-gx-mac
      kind: openvswitch
      datapath: system
      ports:
        - {id: docker-parent, interface: mv-ovs, peer: mv-parent}
        - {id: capture, interface: cap-mac-ovs, peer: cap-mac}
      mirror: {id: mirror-mac, output_port: capture, select_all: true}
    - id: br-gx-ipv
      kind: openvswitch
      datapath: system
      ports:
        - {id: docker-parent, interface: iv-ovs, peer: iv-parent}
        - {id: capture, interface: cap-ipv-ovs, peer: cap-ipv}
      mirror: {id: mirror-ipv, output_port: capture, select_all: true}
  routers:
    - id: domain-router
      kind: linux_namespace
      namespace: gx-router
      forwarding: true
      interfaces:
        - {id: mac, network: gx-mac-domain, address: 10.10.0.1/24, device: r-mac, peer: ovs-r-mac, switch: br-gx-mac}
        - {id: ipv, network: gx-ipv-domain, address: 10.20.0.1/24, device: r-ipv, peer: ovs-r-ipv, switch: br-gx-ipv}
      policies:
        - {id: mac-to-ipv, source: 10.10.0.0/24, destination: 10.20.0.0/24, action: accept}
        - {id: ipv-to-mac, source: 10.20.0.0/24, destination: 10.10.0.0/24, action: accept}
  edge_paths:
    samples: [generator, gx-mac-domain, br-gx-mac, domain-router, br-gx-ipv, gx-ipv-domain, transform]
    transformed: [transform, gx-ipv-domain, sink]
  attachments:
    - id: generator-data
      kind: container_veth
      owner: generator
      network: gx-mac-domain
      address: 10.10.0.10/24
      mac: 02:10:00:00:00:10
      interface: gxc5103c0988d67
      peer: gxh5103c0988d67
      switch: br-gx-mac
      routes: [{destination: 10.20.0.0/24, via: 10.10.0.1}]
    - id: transform-data
      kind: container_veth
      owner: transform
      network: gx-ipv-domain
      address: 10.20.0.20/24
      mac: 02:20:00:00:00:01
      interface: gxcf68db3f19a50
      peer: gxhf68db3f19a50
      switch: br-gx-ipv
      routes: [{destination: 10.10.0.0/24, via: 10.20.0.1}]
    - id: sink-data
      kind: container_veth
      owner: sink
      network: gx-ipv-domain
      address: 10.20.0.30/24
      mac: 02:20:00:00:00:01
      interface: gxc498d40724d3b
      peer: gxh498d40724d3b
      switch: br-gx-ipv
    - id: domain-router-mac
      kind: namespace_veth
      owner: domain-router
      network: gx-mac-domain
      address: 10.10.0.1/24
      interface: r-mac
      peer: ovs-r-mac
      switch: br-gx-mac
    - id: domain-router-ipv
      kind: namespace_veth
      owner: domain-router
      network: gx-ipv-domain
      address: 10.20.0.1/24
      mac: 02:20:00:00:00:01
      interface: r-ipv
      peer: ovs-r-ipv
      switch: br-gx-ipv
    - id: mirror-mac
      kind: mirror
      owner: br-gx-mac
      interface: cap-mac-ovs
      switch: br-gx-mac
    - id: mirror-ipv
      kind: mirror
      owner: br-gx-ipv
      interface: cap-ipv-ovs
      switch: br-gx-ipv
deployment:
  services:
    generator: {image: graphx-demo:latest, command: graphx-generator}
    transform: {image: graphx-demo:latest, command: graphx-transform}
    sink: {image: graphx-demo:latest, command: graphx-sink}
  project: mixed-network
observability:
  capture: {enabled: true, provider: ovs-span}
