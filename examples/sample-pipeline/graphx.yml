# GraphX version 3. Validate/normalize only; execution adapters are unavailable.
catalog: ../../config/catalog/lock.json
connections:
  samples:
    from: generator.samples
    to: transform.samples
    transport: tcp
  transformed:
    from: transform.transformed
    to: sink.transformed
    transport: tcp
graph:
  id: sample-pipeline
nodes:
  generator:
    execution:
      kind: container
    type: sample.source
  sink:
    execution:
      kind: container
    type: sample.sink
  transform:
    execution:
      kind: container
    type: sample.transform
version: 3
