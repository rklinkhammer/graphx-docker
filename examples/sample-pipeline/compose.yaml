# Application startup remains gated for P6; normalization is supplied by graphx compile.
name: graphx

x-node-environment: &node-environment
  GRAPHX_OVERRIDES: ${GRAPHX_OVERRIDES:-}
  GRAPHX_CAPTURE_ENABLED: ${GRAPHX_CAPTURE_ENABLED:-false}
  GRAPHX_CAPTURE_DIR: /captures
  GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}

x-node-service: &node-service
  image: graphx-demo:latest
  volumes:
    - captures:/captures
    - ${GRAPHX_CONFIG_FILE:-./graphx.yml}:/etc/graphx/graphx.yml:ro
  networks: [graphx]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  init: true

services:
  sink:
    <<: *node-service
    entrypoint: ["/usr/local/bin/graphx-sink"]
    environment:
      <<: *node-environment
    depends_on: [telemetry]
  transform:
    <<: *node-service
    entrypoint: ["/usr/local/bin/graphx-transform"]
    environment:
      <<: *node-environment
    depends_on: [sink, telemetry]
  generator:
    <<: *node-service
    entrypoint: ["/usr/local/bin/graphx-generator"]
    environment:
      <<: *node-environment
      GRAPHX_INTERVAL_MS: "500"
    depends_on: [transform, telemetry]
  telemetry:
    image: graphx-telemetry:latest
    ports: ["127.0.0.1:${GRAPHX_PUBLISHED_HTTP_PORT:-8080}:8080"]
    expose: ["9000/udp"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    environment:
      GRAPHX_NORMALIZED_CONFIG: /run/graphx/resolved.json
      GRAPHX_CONFIG_DIRECTORY: /app
      GRAPHX_CAPTURE_ENABLED: ${GRAPHX_CAPTURE_ENABLED:-false}
      GRAPHX_CAPTURE_DIR: /captures
      GRAPHX_CAPTURE_CATALOG_MAX_FILES: ${GRAPHX_CAPTURE_CATALOG_MAX_FILES:-128}
      GRAPHX_CAPTURE_CATALOG_MAX_ENTRIES: ${GRAPHX_CAPTURE_CATALOG_MAX_ENTRIES:-512}
      GRAPHX_CONTROL_TOKEN: ${GRAPHX_CONTROL_TOKEN:-}
      GRAPHX_CONTROL_POLICY_FILE: ${GRAPHX_CONTROL_POLICY_FILE:-}
      GRAPHX_OBSERVATION_TOKEN: ${GRAPHX_OBSERVATION_TOKEN:-}
      GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}
      GRAPHX_HTTP_BIND: 0.0.0.0
      GRAPHX_TELEMETRY_BIND: 0.0.0.0
      GRAPHX_ALLOW_INSECURE_REMOTE: "true"
      GRAPHX_ALLOWED_ORIGINS: ${GRAPHX_ALLOWED_ORIGINS:-http://127.0.0.1:${GRAPHX_PUBLISHED_HTTP_PORT:-8080},http://localhost:${GRAPHX_PUBLISHED_HTTP_PORT:-8080}}
      GRAPHX_OTLP_ENDPOINT: ${GRAPHX_OTLP_ENDPOINT:-}
      GRAPHX_OTLP_AUTH_TOKEN: ${GRAPHX_OTLP_AUTH_TOKEN:-}
      GRAPHX_OTLP_CA_FILE: ${GRAPHX_OTLP_CA_FILE:-}
      GRAPHX_HISTORY_ENABLED: ${GRAPHX_HISTORY_ENABLED:-}
      GRAPHX_HISTORY_DATABASE_FILE: ${GRAPHX_HISTORY_DATABASE_FILE:-}
    volumes: [captures:/captures:ro, "${GX_OUTPUT:?Set GX_OUTPUT to compiled artifacts}:/run/graphx:ro"]
    networks: [graphx]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    init: true

networks:
  graphx:
    driver: bridge

volumes:
  captures:

secrets:
  graphx_ca:
    file: ${GRAPHX_CA_CERT:-/dev/null}
  graphx_cert_installer:
    file: ${GRAPHX_CERT_INSTALL_SCRIPT:-/dev/null}
