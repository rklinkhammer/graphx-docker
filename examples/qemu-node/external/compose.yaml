name: graphx-qemu-external
x-logging: &bounded-logging
  driver: json-file
  options: { max-size: "1m", max-file: "2" }
services:
  host-receiver:
    build:
      context: ../../..
      dockerfile: examples/qemu-node/Dockerfile.services
    image: graphx-qemu-services:latest
    command: ["host/peer.py", "--receiver", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:19001:19001/tcp"
      - "127.0.0.1:19001:19001/udp"
    networks: [qemu-demo]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    init: true
    logging: *bounded-logging

  telemetry:
    build:
      context: ../../..
      dockerfile: docker/telemetry.Dockerfile
      secrets: [graphx_ca, graphx_cert_installer]
      args: { GRAPHX_BUILD_TRUST_FINGERPRINT: "${GRAPHX_BUILD_TRUST_FINGERPRINT:-graphx-trust-v1-none}" }
    image: graphx-telemetry:latest
    ports:
      - "127.0.0.1:${GRAPHX_QEMU_GUI_PORT:-8080}:8080"
      - "127.0.0.1:9000:9000/udp"
    environment:
      GRAPHX_CONFIG: /app/qemu-graphx.yaml
      GRAPHX_HTTP_BIND: 0.0.0.0
      GRAPHX_TELEMETRY_BIND: 0.0.0.0
      GRAPHX_ALLOW_INSECURE_REMOTE: "true"
      GRAPHX_ALLOWED_ORIGINS: "http://127.0.0.1:${GRAPHX_QEMU_GUI_PORT:-8080},http://localhost:${GRAPHX_QEMU_GUI_PORT:-8080}"
      GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}
      GRAPHX_CONTROL_TOKEN: ${GRAPHX_CONTROL_TOKEN:-}
      GRAPHX_QEMU_ACCEL: ${GRAPHX_QEMU_ACCEL:-tcg}
      GRAPHX_QEMU_REQUESTED_ACCEL: ${GRAPHX_QEMU_REQUESTED_ACCEL:-auto}
      GRAPHX_QEMU_EVIDENCE_FILE: /captures/accelerator-evidence.json
      GRAPHX_CAPTURE_ENABLED: ${GRAPHX_CAPTURE_ENABLED:-true}
      GRAPHX_CAPTURE_PROVIDER: pcapng
      GRAPHX_CAPTURE_DIR: /captures
      GRAPHX_CAPTURE_MAX_FILE_BYTES: ${GRAPHX_CAPTURE_MAX_FILE_BYTES:-67108864}
      GRAPHX_CAPTURE_MAX_PACKETS: ${GRAPHX_CAPTURE_MAX_PACKETS:-100000}
      GRAPHX_PACKET_HISTORY_URL: ${GRAPHX_PACKET_HISTORY_URL-http://host.docker.internal:9100}
    volumes:
      - ${GRAPHX_QEMU_RUN_DIR:?set by demo.sh}:/captures:ro
      - ./graphx.yaml:/app/qemu-graphx.yaml:ro
    networks: [qemu-demo]
    extra_hosts: ["host.docker.internal:${GRAPHX_QEMU_HOST_GATEWAY:-host-gateway}"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    init: true
    logging: *bounded-logging

  host-origin:
    build:
      context: ../../..
      dockerfile: examples/qemu-node/Dockerfile.services
    image: graphx-qemu-services:latest
    command: ["host/peer.py", "--origin"]
    environment:
      GRAPHX_PEER_TARGET: host.docker.internal
      GRAPHX_PEER_PORT: "18001"
      GRAPHX_TELEMETRY_HOST: telemetry
      GRAPHX_TELEMETRY_PORT: "9000"
      GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}
      GRAPHX_ORIGIN_INTERVAL_SECONDS: "0.25"
    extra_hosts: ["host.docker.internal:${GRAPHX_QEMU_HOST_GATEWAY:-host-gateway}"]
    depends_on: [telemetry]
    networks: [qemu-demo]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    init: true
    logging: *bounded-logging

networks:
  qemu-demo:
    driver: bridge
    ipam:
      config: [{ subnet: 172.30.12.0/24, gateway: 172.30.12.1 }]

secrets:
  graphx_ca:
    file: ${GRAPHX_CA_CERT:-/dev/null}
  graphx_cert_installer:
    file: ${GRAPHX_CERT_INSTALL_SCRIPT:-/dev/null}
