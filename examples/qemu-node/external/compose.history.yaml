services:
  telemetry:
    environment:
      GRAPHX_HISTORY_ENABLED: ${GRAPHX_HISTORY_ENABLED:-true}
      GRAPHX_HISTORY_BACKEND: sqlite
      GRAPHX_HISTORY_DATABASE_FILE: /var/lib/graphx/history/history.sqlite
      GRAPHX_HISTORY_RETENTION_SECONDS: ${GRAPHX_HISTORY_RETENTION_SECONDS:-86400}
      GRAPHX_HISTORY_MAX_RECORDS: ${GRAPHX_HISTORY_MAX_RECORDS:-50000}
      GRAPHX_HISTORY_MAX_DATABASE_BYTES: ${GRAPHX_HISTORY_MAX_DATABASE_BYTES:-67108864}
    volumes:
      - telemetry-history:/var/lib/graphx/history
volumes:
  telemetry-history:
