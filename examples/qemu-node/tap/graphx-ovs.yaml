version: 2
graph:
  id: qemu-tap-ovs-demo
  nodes:
    - id: host-peer
      kind: diagnostic-endpoint
      runtime: process
      execution: host
      lifecycle: managed
      control: none
      ports:
        - {name: tcp_out, direction: output, schema: RawTcpBytes}
        - {name: udp_out, direction: output, schema: RawUdpDatagram}
        - {name: tcp_in, direction: input, schema: RawTcpBytes}
        - {name: udp_in, direction: input, schema: RawUdpDatagram}
    - id: qemu-node
      kind: virtual-machine
      runtime: qemu
      execution: host
      lifecycle: external
      control: none
      accelerator: tcg
      architecture: x86_64
      ports:
        - {name: tcp_in, direction: input, schema: RawTcpBytes}
        - {name: udp_in, direction: input, schema: RawUdpDatagram}
        - {name: tcp_out, direction: output, schema: RawTcpBytes}
        - {name: udp_out, direction: output, schema: RawUdpDatagram}
  edges:
    - {id: peer-qemu-tcp, from: host-peer.tcp_out, to: qemu-node.tcp_in, transport: tcp, data_plane: external}
    - {id: peer-qemu-udp, from: host-peer.udp_out, to: qemu-node.udp_in, transport: udp, data_plane: external}
    - {id: qemu-peer-tcp, from: qemu-node.tcp_out, to: host-peer.tcp_in, transport: tcp, data_plane: external}
    - {id: qemu-peer-udp, from: qemu-node.udp_out, to: host-peer.udp_in, transport: udp, data_plane: external}
transport:
  tcp:
    peer-qemu-tcp: {host: 10.0.2.15, bind: 0.0.0.0, port: 18001, framing: none}
    qemu-peer-tcp: {host: 10.0.2.2, bind: 0.0.0.0, port: 19001, framing: none}
  udp:
    peer-qemu-udp: {mode: unicast, destination: 10.0.2.15, bind: 0.0.0.0, port: 18001, max_datagram_bytes: 1400, framing: none}
    qemu-peer-udp: {mode: unicast, destination: 10.0.2.2, bind: 0.0.0.0, port: 19001, max_datagram_bytes: 1400, framing: none}
network:
  networks:
    - {id: qemu-lan, gateway: 10.0.2.2, external: false, profile: ethernet, subnets: [10.0.2.0/24]}
  switches:
    - id: br-qemu-tap
      kind: openvswitch
      datapath: system
      ports:
        - {id: qemu, interface: gxqtap0, vlan: {access_tag: 42}}
        - {id: peer, interface: gxqpeer0, peer: gxqpeer1, vlan: {access_tag: 42}}
        - {id: isolated, interface: gxqiso0, peer: gxqiso1, vlan: {access_tag: 43}}
        - {id: capture, interface: gxqcap0, peer: gxqcap1}
      mirror: {id: qemu-span, output_port: capture, select_all: true}
  routers:
    - id: qemu-peer
      kind: linux_namespace
      namespace: gx-qemu-peer
      forwarding: false
      interfaces:
        - {id: data, network: qemu-lan, address: 10.0.2.2/24, device: gxqpeer1, peer: gxqpeer0, switch: br-qemu-tap}
        - {id: isolated, network: qemu-lan, address: 10.0.2.99/24, device: gxqiso1, peer: gxqiso0, switch: br-qemu-tap}
  edge_paths:
    peer-qemu-tcp: [host-peer, qemu-lan, br-qemu-tap, qemu-node]
    peer-qemu-udp: [host-peer, qemu-lan, br-qemu-tap, qemu-node]
    qemu-peer-tcp: [qemu-node, br-qemu-tap, qemu-lan, host-peer]
    qemu-peer-udp: [qemu-node, br-qemu-tap, qemu-lan, host-peer]
  attachments:
    - id: qemu-data
      kind: qemu_tap
      owner: qemu-node
      network: qemu-lan
      address: 10.0.2.15/24
      mac: 02:00:00:00:02:15
      interface: gxqtap0
      switch: br-qemu-tap
      tap_uid: 65532
      tap_gid: 65532
    - id: peer-data
      kind: namespace_veth
      owner: qemu-peer
      network: qemu-lan
      address: 10.0.2.2/24
      interface: gxqpeer1
      peer: gxqpeer0
      switch: br-qemu-tap
    - id: isolated-data
      kind: namespace_veth
      owner: qemu-peer
      network: qemu-lan
      address: 10.0.2.99/24
      interface: gxqiso1
      peer: gxqiso0
      switch: br-qemu-tap
    - id: qemu-span
      kind: mirror
      owner: br-qemu-tap
      interface: gxqcap0
      switch: br-qemu-tap
observability:
  metrics: {enabled: true, exporters: [console, udp-json]}
  tracing: {enabled: false, exporters: [console]}
  telemetry: {host: 127.0.0.1, port: 9000, websocket: /ws, heartbeat_interval_ms: 1000, heartbeat_timeout_ms: 10000}
  capture: {enabled: true, provider: ovs-span, directory: /var/lib/graphx/qemu/m6, max_file_bytes: 67108864, max_packets: 100000}
  history: {enabled: true, backend: sqlite, database_file: /var/lib/graphx/qemu/m6/packet-history.sqlite, retention_seconds: 86400, max_records: 50000, max_database_bytes: 67108864}
