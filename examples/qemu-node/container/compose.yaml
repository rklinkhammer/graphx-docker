name: graphx-qemu-container
x-logging: &bounded-logging
  driver: json-file
  options: { max-size: "1m", max-file: "2" }
services:
  normalize-config:
    build:
      context: ../../..
      secrets: [graphx_ca, graphx_cert_installer]
      args: { GRAPHX_BUILD_TRUST_FINGERPRINT: "${GRAPHX_BUILD_TRUST_FINGERPRINT:-graphx-trust-v1-none}" }
    image: graphx-demo:latest
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        umask 022;
        /usr/local/bin/graphx config normalize /config/graphx.yaml > /run/graphx/normalized.json.tmp;
        chmod 0444 /run/graphx/normalized.json.tmp;
        mv /run/graphx/normalized.json.tmp /run/graphx/normalized.json
    volumes: [./graphx.yaml:/config/graphx.yaml:ro, normalized-config:/run/graphx]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    restart: "no"
  host-receiver:
    build:
      context: ../../..
      dockerfile: examples/qemu-node/Dockerfile.services
    image: graphx-qemu-services:latest
    command: ["host/peer.py", "--receiver", "--bind", "0.0.0.0"]
    networks: [qemu-demo]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    init: true
    logging: *bounded-logging

  qemu-node:
    build:
      context: ../../..
      dockerfile: examples/qemu-node/Dockerfile.qemu-runtime
      secrets: [graphx_ca, graphx_cert_installer]
      args: { GRAPHX_BUILD_TRUST_FINGERPRINT: "${GRAPHX_BUILD_TRUST_FINGERPRINT:-graphx-trust-v1-none}" }
    image: graphx-qemu-runtime:latest
    user: "${GRAPHX_HOST_UID:-65532}:${GRAPHX_HOST_GID:-65532}"
    environment:
      GRAPHX_QEMU_ACCEL: ${GRAPHX_QEMU_ACCEL:-tcg}
      GRAPHX_QEMU_REQUESTED_ACCEL: ${GRAPHX_QEMU_REQUESTED_ACCEL:-auto}
      GRAPHX_CAPTURE_SOURCE_MAX_BYTES: ${GRAPHX_CAPTURE_SOURCE_MAX_BYTES:-67108864}
    expose: ["18001/tcp", "18001/udp"]
    volumes:
      - ../output/images:/artifacts:ro
      - ${GRAPHX_QEMU_RUN_DIR:?set by demo.sh}:/captures
    depends_on: [host-receiver]
    networks: [qemu-demo]
    read_only: true
    tmpfs:
      - /tmp
      - /run/graphx-qemu:uid=${GRAPHX_HOST_UID:-65532},gid=${GRAPHX_HOST_GID:-65532},mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    init: true
    healthcheck:
      test: ["CMD", "/usr/local/bin/qemu-healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    logging: *bounded-logging

  telemetry:
    build:
      context: ../../..
      dockerfile: docker/telemetry.Dockerfile
      secrets: [graphx_ca, graphx_cert_installer]
      args: { GRAPHX_BUILD_TRUST_FINGERPRINT: "${GRAPHX_BUILD_TRUST_FINGERPRINT:-graphx-trust-v1-none}" }
    image: graphx-telemetry:latest
    ports: ["127.0.0.1:${GRAPHX_QEMU_GUI_PORT:-8080}:8080"]
    expose: ["9000/udp"]
    environment:
      GRAPHX_NORMALIZED_CONFIG: /run/graphx/normalized.json
      GRAPHX_CONFIG_DIRECTORY: /app
      GRAPHX_HTTP_BIND: 0.0.0.0
      GRAPHX_TELEMETRY_BIND: 0.0.0.0
      GRAPHX_ALLOW_INSECURE_REMOTE: "true"
      GRAPHX_ALLOWED_ORIGINS: "http://127.0.0.1:${GRAPHX_QEMU_GUI_PORT:-8080},http://localhost:${GRAPHX_QEMU_GUI_PORT:-8080}"
      GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}
      GRAPHX_CONTROL_TOKEN: ${GRAPHX_CONTROL_TOKEN:-}
      GRAPHX_QEMU_ACCEL: ${GRAPHX_QEMU_ACCEL:-tcg}
      GRAPHX_QEMU_REQUESTED_ACCEL: ${GRAPHX_QEMU_REQUESTED_ACCEL:-auto}
      GRAPHX_QEMU_EVIDENCE_FILE: /captures/accelerator-evidence.json
      GRAPHX_CAPTURE_ENABLED: ${GRAPHX_CAPTURE_ENABLED:-true}
      GRAPHX_CAPTURE_PROVIDER: pcapng
      GRAPHX_CAPTURE_DIR: /captures
      GRAPHX_CAPTURE_MAX_FILE_BYTES: ${GRAPHX_CAPTURE_MAX_FILE_BYTES:-67108864}
      GRAPHX_CAPTURE_MAX_PACKETS: ${GRAPHX_CAPTURE_MAX_PACKETS:-100000}
      GRAPHX_PACKET_HISTORY_URL: ${GRAPHX_PACKET_HISTORY_URL-http://packet-observer:9100}
    volumes:
      - ${GRAPHX_QEMU_RUN_DIR:?set by demo.sh}:/captures:ro
      - normalized-config:/run/graphx:ro
    depends_on:
      normalize-config: { condition: service_completed_successfully }
    networks: [qemu-demo]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    init: true
    logging: *bounded-logging

  packet-observer:
    build:
      context: ../../..
      dockerfile: examples/qemu-node/Dockerfile.services
    image: graphx-qemu-services:latest
    command: ["tools/packet_observer.py", "--capture", "/captures/qemu-node.pcap", "--pcapng", "/captures/qemu-node.pcapng", "--database", "/captures/packet-history.sqlite", "--http-bind", "0.0.0.0"]
    user: "${GRAPHX_HOST_UID:-65532}:${GRAPHX_HOST_GID:-65532}"
    environment:
      GRAPHX_TELEMETRY_HOST: telemetry
      GRAPHX_TELEMETRY_PORT: "9000"
      GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}
      GRAPHX_QEMU_RUN_ID: ${GRAPHX_QEMU_RUN_ID:?set by demo.sh}
      GRAPHX_CAPTURE_MAX_FILE_BYTES: ${GRAPHX_CAPTURE_MAX_FILE_BYTES:-67108864}
      GRAPHX_CAPTURE_MAX_PACKETS: ${GRAPHX_CAPTURE_MAX_PACKETS:-100000}
      GRAPHX_CAPTURE_ENABLED: ${GRAPHX_CAPTURE_ENABLED:-true}
      GRAPHX_PACKET_HISTORY_ENABLED: ${GRAPHX_HISTORY_ENABLED:-true}
      GRAPHX_PACKET_HISTORY_RETENTION_SECONDS: ${GRAPHX_PACKET_HISTORY_RETENTION_SECONDS:-86400}
      GRAPHX_PACKET_HISTORY_MAX_RECORDS: ${GRAPHX_PACKET_HISTORY_MAX_RECORDS:-50000}
      GRAPHX_PACKET_HISTORY_MAX_DATABASE_BYTES: ${GRAPHX_PACKET_HISTORY_MAX_DATABASE_BYTES:-67108864}
    volumes:
      - ${GRAPHX_QEMU_RUN_DIR:?set by demo.sh}:/captures
    depends_on: [qemu-node, telemetry]
    networks: [qemu-demo]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    init: true
    logging: *bounded-logging

  host-origin:
    build:
      context: ../../..
      dockerfile: examples/qemu-node/Dockerfile.services
    image: graphx-qemu-services:latest
    command: ["host/peer.py", "--origin"]
    environment:
      GRAPHX_PEER_TARGET: qemu-node
      GRAPHX_PEER_PORT: "18001"
      GRAPHX_TELEMETRY_HOST: telemetry
      GRAPHX_TELEMETRY_PORT: "9000"
      GRAPHX_TELEMETRY_SHARED_SECRET: ${GRAPHX_TELEMETRY_SHARED_SECRET:-}
      GRAPHX_ORIGIN_INTERVAL_SECONDS: "0.25"
    depends_on:
      qemu-node: { condition: service_healthy }
      telemetry: { condition: service_started }
    networks: [qemu-demo]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    init: true
    logging: *bounded-logging

networks:
  qemu-demo:
    driver: bridge
    ipam:
      config: [{ subnet: 172.30.12.0/24, gateway: 172.30.12.1 }]

volumes:
  normalized-config:

secrets:
  graphx_ca:
    file: ${GRAPHX_CA_CERT:-/dev/null}
  graphx_cert_installer:
    file: ${GRAPHX_CERT_INSTALL_SCRIPT:-/dev/null}
