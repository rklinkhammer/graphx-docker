services:
  generator:
    extends: {file: ../infrastructure/compose/services.yaml, service: native}
    build:
      context: ${GRAPHX_REPO_ROOT:?set repository root}
      secrets: [graphx_ca, graphx_cert_installer]
    image: graphx-demo:latest
    entrypoint: [/usr/local/bin/graphx-generator]
    volumes: ["${GRAPHX_LAB_CONFIG:?set laboratory config}:/etc/graphx/graphx.yaml:ro"]
  transform:
    extends: {file: ../infrastructure/compose/services.yaml, service: native}
    image: graphx-demo:latest
    entrypoint: [/usr/local/bin/graphx-transform]
    volumes: ["${GRAPHX_LAB_CONFIG:?set laboratory config}:/etc/graphx/graphx.yaml:ro"]
  sink:
    extends: {file: ../infrastructure/compose/services.yaml, service: native}
    image: graphx-demo:latest
    entrypoint: [/usr/local/bin/graphx-sink]
    volumes: ["${GRAPHX_LAB_CONFIG:?set laboratory config}:/etc/graphx/graphx.yaml:ro"]
secrets:
  graphx_ca: {file: "${GRAPHX_CA_CERT:-/dev/null}"}
  graphx_cert_installer: {file: "${GRAPHX_CERT_INSTALL_SCRIPT:-/dev/null}"}
